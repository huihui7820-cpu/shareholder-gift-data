name: 每天自動更新紀念品

on:
  schedule:
    # 每天台灣時間早上 8 點執行 (UTC時間0點)
    - cron: '0 0 * * *'
  workflow_dispatch: # 允許我們手動點擊按鈕測試

permissions:
  contents: write # 允許機器人把新檔案寫進資料夾

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: 下載資料夾內容
      uses: actions/checkout@v3

    - name: 安裝 Python 環境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 安裝機器人需要的工具
      run: |
        pip install requests pandas lxml bs4

    - name: 執行抓取程式！
      run: python scraper.py

    - name: 把新資料存檔並上傳
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add .
        # 如果有新資料就存檔，沒有就略過
        git commit -m "更新股東會紀念品資料" || echo "今天沒有新資料"
        git push
